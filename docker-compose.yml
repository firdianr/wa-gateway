services:
  wa-gateway:
    build: .
    container_name: wa-gateway-standalone
    restart: unless-stopped
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - wa_session_data:/app/auth_info_baileys

volumes:
  wa_session_data:
    driver: local
